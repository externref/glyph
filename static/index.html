<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>glyph</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Geist:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/style.css" />
    <link
      id="favicon"
      rel="icon"
      type="image/x-icon"
      href="static/favicon.svg"
    />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Geist", "sans-serif"],
              mono: ["JetBrains Mono", "monospace"],
            },
          },
        },
      };
    </script>
    <style>
      .hidden {
        display: none !important;
      }

      .modal-backdrop {
        position: fixed;
        inset: 0;
        background: hsla(0, 0%, 0%, 0.6);
        backdrop-filter: blur(4px);
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
      }

      .modal {
        background: hsl(240 10% 7%);
        border: 1px solid var(--border-mid);
        border-radius: 14px;
        padding: 24px;
        width: 100%;
        max-width: 420px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        box-shadow: 0 24px 60px hsla(0, 0%, 0%, 0.5);
      }

      .modal-header {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .modal-title {
        font-size: 16px;
        font-weight: 600;
        color: var(--text);
      }
      .modal-sub {
        font-size: 13px;
        color: var(--text-muted);
        line-height: 1.5;
      }
      .modal-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 4px;
      }

      .delete-key-box {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        background: var(--bg);
        border: 1px solid var(--border-mid);
        border-radius: 8px;
        padding: 10px 12px;
      }

      .delete-key-text {
        font-family: var(--font-mono);
        font-size: 12px;
        color: var(--accent-soft);
        word-break: break-all;
      }

      .key-label {
        font-size: 12px;
        font-weight: 500;
        color: var(--text-muted);
        margin-bottom: 6px;
        display: flex;
        align-items: center;
        gap: 5px;
      }
    </style>
  </head>
  <body>
    <nav class="nav">
      <a href="/" class="nav-brand">
        <div class="nav-logo">
          <i class="bi bi-braces"></i>
        </div>
        <span class="nav-title">gly<span class="accent">ph</span></span>
      </a>
      <span class="nav-tagline">Share code. Fast.</span>
    </nav>

    <main class="main">
      <div class="page-header">
        <h1 class="page-title">New Paste</h1>
        <p class="page-sub">
          Paste your code or text below and share it instantly.
        </p>
      </div>

      <div class="form-stack">
        <div class="toolbar">
          <div class="toolbar-left">
            <label for="filename" class="field-label">
              <i class="bi bi-file-code"></i>Filename
            </label>
            <input
              type="text"
              id="filename"
              name="filename"
              placeholder="optional"
              autocomplete="off"
              spellcheck="false"
              class="input-custom"
            />

            <div class="divider"></div>

            <label for="language" class="field-label">
              <i class="bi bi-code-slash"></i>Language
            </label>
            <div class="select-wrap">
              <select id="language" name="language" class="select-custom">
                <option value="text">Plain Text</option>
                <option value="typescript">TypeScript</option>
                <option value="python">Python</option>
                <option value="c">C</option>
                <option value="c++">C++</option>
                <option value="js">JavaScript</option>
                <option value="ts">TypeScript (ts)</option>
                <option value="java">Java</option>
                <option value="rust">Rust</option>
                <option value="html">HTML</option>
                <option value="css">CSS</option>
                <option value="svelte">Svelte</option>
                <option value="lua">Lua</option>
                <option value="asm">Assembly</option>
                <option value="go">Go</option>
              </select>
              <i class="bi bi-chevron-down select-arrow"></i>
            </div>
            <span id="langBadge" class="lang-badge">
              <i class="bi bi-circle-fill" style="font-size: 6px"></i>
              <span id="langBadgeText">text</span>
            </span>
          </div>

          <div class="toolbar-right">
            <span id="charCount" class="char-count">0 chars</span>
            <button type="button" onclick="clearEditor()" class="btn-ghost">
              <i class="bi bi-trash3"></i>
              <span>Clear</span>
            </button>
          </div>
        </div>

        <div class="card-editor">
          <div class="editor-titlebar">
            <span class="dot dot-red"></span>
            <span class="dot dot-yellow"></span>
            <span class="dot dot-green"></span>
            <span id="editorFilename" class="editor-filename">paste.txt</span>
          </div>

          <div class="editor-wrap">
            <div class="line-numbers" id="lineNumbers">1</div>
            <textarea
              id="content"
              class="editor-textarea"
              placeholder="Paste your code here..."
              spellcheck="false"
              autocorrect="off"
              autocapitalize="off"
            ></textarea>
          </div>
        </div>

        <div class="action-row">
          <p class="action-note">
            <i class="bi bi-shield-check"></i>
            Pastes are public and accessible via link.
          </p>
          <button
            type="button"
            id="submitBtn"
            onclick="submitPaste()"
            class="btn-primary"
          >
            <i class="bi bi-cloud-upload" id="submitIcon"></i>
            <span id="submitText">Create Paste</span>
          </button>
        </div>
      </div>
    </main>

    <div id="toastContainer"></div>

    <div id="createdModal" class="modal-backdrop hidden">
      <div class="modal">
        <div class="modal-header">
          <i
            class="bi bi-check-circle-fill"
            style="color: var(--accent); font-size: 20px"
          ></i>
          <h2 class="modal-title">Paste Created!</h2>
        </div>
        <p class="modal-sub">
          Save your delete key — you won't be able to retrieve it later.
        </p>
        <div>
          <p class="key-label"><i class="bi bi-key"></i> Delete Key</p>
          <div class="delete-key-box">
            <code id="createdDeleteKey" class="delete-key-text"></code>
            <button class="btn-ghost" onclick="copyDeleteKey()" title="Copy">
              <i class="bi bi-clipboard" id="copyKeyIcon"></i>
            </button>
          </div>
        </div>
        <div class="modal-actions">
          <button class="btn-primary" onclick="goToPaste()">
            View Paste <i class="bi bi-arrow-right"></i>
          </button>
        </div>
      </div>
    </div>

    <script>
      const textarea = document.getElementById("content");
      const lineNumbers = document.getElementById("lineNumbers");
      const charCount = document.getElementById("charCount");
      const langSelect = document.getElementById("language");
      const langBadgeText = document.getElementById("langBadgeText");
      const editorFilename = document.getElementById("editorFilename");
      const filenameInput = document.getElementById("filename");
      let pendingPasteUrl = "/";

      const langExtMap = {
        text: "txt",
        typescript: "ts",
        python: "py",
        c: "c",
        "c++": "cpp",
        js: "js",
        ts: "ts",
        java: "java",
        rust: "rs",
        html: "html",
        css: "css",
        svelte: "svelte",
        lua: "lua",
        asm: "asm",
        go: "go",
      };

      function updateLineNumbers() {
        const lines = textarea.value.split("\n").length;
        lineNumbers.textContent = Array.from(
          { length: lines },
          (_, i) => i + 1,
        ).join("\n");
      }

      function updateCharCount() {
        const len = textarea.value.length;
        charCount.style.color =
          len > 50000 ? "hsl(0 70% 60%)" : len > 20000 ? "hsl(40 70% 60%)" : "";
        charCount.textContent = len.toLocaleString() + " chars";
      }

      function updateEditorFilename() {
        const custom = filenameInput.value.trim();
        editorFilename.textContent =
          custom || `paste.${langExtMap[langSelect.value] || "txt"}`;
      }

      function updateLangBadge() {
        langBadgeText.textContent = langSelect.value;
        updateEditorFilename();
      }

      textarea.addEventListener("input", () => {
        updateLineNumbers();
        updateCharCount();
      });

      textarea.addEventListener("keydown", (e) => {
        if (e.key === "Tab") {
          e.preventDefault();
          const s = textarea.selectionStart,
            end = textarea.selectionEnd;
          textarea.value =
            textarea.value.substring(0, s) +
            "  " +
            textarea.value.substring(end);
          textarea.selectionStart = textarea.selectionEnd = s + 2;
          updateLineNumbers();
        }
      });

      textarea.addEventListener("scroll", () => {
        lineNumbers.scrollTop = textarea.scrollTop;
      });
      langSelect.addEventListener("change", updateLangBadge);
      filenameInput.addEventListener("input", updateEditorFilename);

      function clearEditor() {
        textarea.value = "";
        filenameInput.value = "";
        updateLineNumbers();
        updateCharCount();
        updateEditorFilename();
        textarea.focus();
      }

      function showToast(message, type = "success") {
        const container = document.getElementById("toastContainer");
        const toast = document.createElement("div");
        const ok = type === "success";
        toast.className = "toast";
        toast.innerHTML = `
        <div class="toast-inner ${ok ? "toast-ok" : "toast-err"}">
          <i class="bi bi-${ok ? "check-circle-fill" : "x-circle-fill"}"></i>
          <span>${message}</span>
        </div>
      `;
        container.appendChild(toast);
        setTimeout(() => {
          toast.classList.add("hide");
          setTimeout(() => toast.remove(), 200);
        }, 3500);
      }

      function goToPaste() {
        window.location.href = pendingPasteUrl;
      }

      async function copyDeleteKey() {
        const key = document.getElementById("createdDeleteKey").textContent;
        await navigator.clipboard.writeText(key);
        const icon = document.getElementById("copyKeyIcon");
        icon.className = "bi bi-clipboard-check";
        setTimeout(() => {
          icon.className = "bi bi-clipboard";
        }, 2000);
      }

      async function submitPaste() {
        const content = textarea.value.trim();
        if (!content) {
          showToast("Please enter some content.", "error");
          textarea.focus();
          return;
        }

        const language = langSelect.value;
        const filename = filenameInput.value.trim() || null;
        const btn = document.getElementById("submitBtn");
        const icon = document.getElementById("submitIcon");
        const text = document.getElementById("submitText");

        btn.disabled = true;
        icon.className = "bi bi-arrow-repeat spin";
        text.textContent = "Creating...";

        try {
          const res = await fetch("/api/create", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ content, language, filename }),
          });
          if (!res.ok) {
            const err = await res.json().catch(() => ({}));
            throw new Error(err.detail || `Server error ${res.status}`);
          }
          const data = await res.json();
          pendingPasteUrl = data.url || `/${data.id}`;
          document.getElementById("createdDeleteKey").textContent =
            data.delete_key;
          document.getElementById("createdModal").classList.remove("hidden");
        } catch (err) {
          showToast(err.message || "Failed to create paste.", "error");
        } finally {
          btn.disabled = false;
          icon.className = "bi bi-cloud-upload";
          text.textContent = "Create Paste";
        }
      }

      document.addEventListener("keydown", (e) => {
        if ((e.metaKey || e.ctrlKey) && e.key === "Enter") submitPaste();
      });

      updateLineNumbers();
      updateLangBadge();
    </script>
  </body>
</html>
