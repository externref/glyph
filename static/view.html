<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>glyph</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Geist:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-okaidia.min.css"
    />
    <link rel="stylesheet" href="/static/style.css" />
    <link rel="stylesheet" href="/static/view.css" />

    <link
      id="favicon"
      rel="icon"
      type="image/x-icon"
      href="static/favicon.svg"
    />
  </head>
  <body>
    <nav class="nav">
      <a href="/" class="nav-brand">
        <div class="nav-logo">
          <i class="bi bi-braces"></i>
        </div>
        <span class="nav-title">gly<span class="accent">ph</span></span>
      </a>
      <div class="nav-actions">
        <a href="/" class="btn-outline">
          <i class="bi bi-plus"></i>
          New Paste
        </a>
      </div>
    </nav>

    <main class="main" id="main">
      <div id="loadingState" class="state-box">
        <i
          class="bi bi-arrow-repeat spin"
          style="font-size: 22px; color: var(--accent)"
        ></i>
        <span>Loading paste...</span>
      </div>

      <div id="errorState" class="state-box hidden">
        <i
          class="bi bi-exclamation-circle"
          style="font-size: 28px; color: hsl(0 60% 60%)"
        ></i>
        <p class="state-title">Paste not found</p>
        <p class="state-sub">
          This paste may have been deleted or never existed.
        </p>
        <a href="/" class="btn-primary" style="margin-top: 8px"
          >Create a new paste</a
        >
      </div>

      <div id="pasteView" class="hidden">
        <div class="paste-header">
          <div class="paste-meta">
            <div class="paste-filename" id="pasteFilename">paste.txt</div>
            <div class="paste-info">
              <span class="meta-badge" id="pasteLang">text</span>
              <span class="meta-dot"></span>
              <span class="meta-text" id="pasteDate"></span>
            </div>
          </div>
          <div class="paste-actions">
            <button
              class="btn-icon"
              id="copyBtn"
              onclick="copyContent()"
              title="Copy"
            >
              <i class="bi bi-clipboard" id="copyIcon"></i>
            </button>
            <button
              class="btn-icon"
              id="rawBtn"
              onclick="viewRaw()"
              title="Raw"
            >
              <i class="bi bi-file-text"></i>
            </button>
            <button
              class="btn-icon btn-icon-danger"
              id="deleteBtn"
              onclick="openDeleteModal()"
              title="Delete"
            >
              <i class="bi bi-trash3"></i>
            </button>
          </div>
        </div>

        <div class="code-card">
          <div class="code-wrap">
            <div class="line-numbers" id="lineNumbers">1</div>
            <div class="code-scroll">
              <pre class="code-pre"><code id="codeBlock"></code></pre>
            </div>
          </div>
        </div>
      </div>
    </main>

    <div id="deleteModal" class="modal-backdrop hidden">
      <div class="modal">
        <div class="modal-header">
          <i class="bi bi-trash3" style="color: hsl(0 60% 60%)"></i>
          <h2 class="modal-title">Delete Paste</h2>
        </div>
        <p class="modal-sub">
          Enter your delete key to permanently remove this paste.
        </p>
        <input
          type="text"
          id="deleteKeyInput"
          class="input-custom"
          style="width: 100%"
          placeholder="Delete key"
          autocomplete="off"
          spellcheck="false"
        />
        <div class="modal-actions">
          <button class="btn-outline" onclick="closeDeleteModal()">
            Cancel
          </button>
          <button
            class="btn-danger"
            id="confirmDeleteBtn"
            onclick="confirmDelete()"
          >
            <i class="bi bi-trash3" id="deleteIcon"></i>
            <span id="deleteText">Delete</span>
          </button>
        </div>
      </div>
    </div>

    <div id="toastContainer"></div>

    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/prism.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-python.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-typescript.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-javascript.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-c.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-cpp.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-java.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-rust.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-markup.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-css.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-lua.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-go.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-nasm.min.js"></script>

    <script>
      const langMap = {
        python: "python",
        typescript: "typescript",
        ts: "typescript",
        js: "javascript",
        javascript: "javascript",
        c: "c",
        "c++": "cpp",
        java: "java",
        rust: "rust",
        html: "markup",
        css: "css",
        svelte: "markup",
        lua: "lua",
        go: "go",
        asm: "nasm",
        text: null,
      };

      const langExtMap = {
        text: "txt",
        typescript: "ts",
        python: "py",
        c: "c",
        "c++": "cpp",
        js: "js",
        ts: "ts",
        java: "java",
        rust: "rs",
        html: "html",
        css: "css",
        svelte: "svelte",
        lua: "lua",
        asm: "asm",
        go: "go",
      };

      let pasteContent = "";
      let pasteId = "";

      function show(id) {
        document.getElementById(id).classList.remove("hidden");
      }
      function hide(id) {
        document.getElementById(id).classList.add("hidden");
      }

      function buildLineNumbers(text) {
        const count = text.split("\n").length;
        return Array.from({ length: count }, (_, i) => i + 1).join("\n");
      }

      function formatDate(iso) {
        return new Date(iso).toLocaleString(undefined, {
          year: "numeric",
          month: "short",
          day: "numeric",
          hour: "2-digit",
          minute: "2-digit",
        });
      }

      async function loadPaste() {
        pasteId = location.pathname.slice(1);
        try {
          const res = await fetch(`/api/paste/${pasteId}`);
          if (!res.ok) {
            hide("loadingState");
            show("errorState");
            return;
          }
          const data = await res.json();

          pasteContent = data.content;
          const lang = data.language || "text";
          const prismLang = langMap[lang];
          const ext = langExtMap[lang] || "txt";
          const filename = data.filename || `paste.${ext}`;

          document.title = `${filename} — glyph`;
          document.getElementById("pasteFilename").textContent = filename;
          document.getElementById("pasteLang").textContent = lang;
          document.getElementById("pasteDate").textContent = formatDate(
            data.created_at,
          );

          const codeBlock = document.getElementById("codeBlock");
          codeBlock.textContent = data.content;

          if (prismLang) {
            codeBlock.className = `language-${prismLang}`;
            Prism.highlightElement(codeBlock);
          }

          document.getElementById("lineNumbers").textContent = buildLineNumbers(
            data.content,
          );

          hide("loadingState");
          show("pasteView");
        } catch {
          hide("loadingState");
          show("errorState");
        }
      }

      async function copyContent() {
        await navigator.clipboard.writeText(pasteContent);
        const icon = document.getElementById("copyIcon");
        icon.className = "bi bi-clipboard-check";
        showToast("Copied to clipboard!");
        setTimeout(() => {
          icon.className = "bi bi-clipboard";
        }, 2000);
      }

      function viewRaw() {
        const blob = new Blob([pasteContent], { type: "text/plain" });
        window.open(URL.createObjectURL(blob), "_blank");
      }

      function openDeleteModal() {
        show("deleteModal");
        document.getElementById("deleteKeyInput").focus();
      }

      function closeDeleteModal() {
        hide("deleteModal");
        document.getElementById("deleteKeyInput").value = "";
      }

      async function confirmDelete() {
        const key = document.getElementById("deleteKeyInput").value.trim();
        if (!key) {
          showToast("Enter your delete key.", "error");
          return;
        }

        const btn = document.getElementById("confirmDeleteBtn");
        const icon = document.getElementById("deleteIcon");
        const text = document.getElementById("deleteText");
        btn.disabled = true;
        icon.className = "bi bi-arrow-repeat spin";
        text.textContent = "Deleting...";

        try {
          const res = await fetch(
            `/api/paste/${pasteId}?delete_key=${encodeURIComponent(key)}`,
            { method: "DELETE" },
          );
          if (!res.ok) {
            const err = await res.json().catch(() => ({}));
            throw new Error(err.detail || "Failed to delete.");
          }
          showToast("Paste deleted.");
          closeDeleteModal();
          setTimeout(() => {
            window.location.href = "/";
          }, 1200);
        } catch (err) {
          showToast(err.message, "error");
          btn.disabled = false;
          icon.className = "bi bi-trash3";
          text.textContent = "Delete";
        }
      }

      document.getElementById("deleteModal").addEventListener("click", (e) => {
        if (e.target === e.currentTarget) closeDeleteModal();
      });

      document
        .getElementById("deleteKeyInput")
        .addEventListener("keydown", (e) => {
          if (e.key === "Enter") confirmDelete();
          if (e.key === "Escape") closeDeleteModal();
        });

      function showToast(message, type = "success") {
        const container = document.getElementById("toastContainer");
        const toast = document.createElement("div");
        const ok = type === "success";
        toast.className = "toast";
        toast.innerHTML = `
        <div class="toast-inner ${ok ? "toast-ok" : "toast-err"}">
          <i class="bi bi-${ok ? "check-circle-fill" : "x-circle-fill"}"></i>
          <span>${message}</span>
        </div>
      `;
        container.appendChild(toast);
        setTimeout(() => {
          toast.classList.add("hide");
          setTimeout(() => toast.remove(), 200);
        }, 3500);
      }

      loadPaste();
    </script>
  </body>
</html>
